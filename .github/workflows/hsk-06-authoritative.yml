name: HSK-06 authoritative evaluation
on:
  push:
    branches: [hsk-06-protected-actions-evidence]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hsk-06-protected-actions-evidence }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hsk06-authoritative.py
      - run: pnpm exec prettier --write apps/worker/src apps/web/public/webmcp.js tests
      - run: |
          rm scripts/hsk06-authoritative.py .github/workflows/hsk-06-authoritative.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src apps/web/public/webmcp.js tests scripts .github/workflows
          git commit -m 'fix(hsk-06): use authoritative catalog evaluation'
          git push
