name: HSK-06 page consent UX
on:
  push:
    branches: [hsk-06-protected-actions-evidence]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hsk-06-protected-actions-evidence
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hsk06-page-consent.py
      - run: pnpm exec prettier --write apps/web/public
      - run: |
          rm scripts/hsk06-page-consent.py .github/workflows/hsk-06-page-consent.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public scripts .github/workflows
          git commit -m 'feat(hsk-06): add exact page confirmation and receipt export'
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:hsk-06-protected-actions-evidence
