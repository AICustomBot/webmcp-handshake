name: HSK-04 reviewed runtime correction

on:
  push:
    branches:
      - hsk-04-shared-canvas

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hsk-04-shared-canvas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hsk04_runtime_fix.py
      - run: pnpm exec prettier --write .
      - name: Commit reviewed corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/index.ts apps/worker/src/runtime-utils.ts docs/RUNTIME.md tests/runtime.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(hsk-04): harden merged runtime after review'
          git push
