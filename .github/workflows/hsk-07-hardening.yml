name: HSK-07 release hardening
on:
  push:
    branches: [hsk-07-release-hardening]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hsk-07-release-hardening
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hsk07-hardening.py
      - run: pnpm exec prettier --write apps/worker/src tests
      - run: |
          rm scripts/hsk07-hardening.py .github/workflows/hsk-07-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps tests scripts .github/workflows
          git commit -m 'feat(hsk-07): add health and streamed-body verification'
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:hsk-07-release-hardening
