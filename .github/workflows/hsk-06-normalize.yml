name: HSK-06 legacy normalization
on:
  push:
    branches: [hsk-06-protected-actions-evidence]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hsk-06-protected-actions-evidence
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hsk06-normalize.py
      - run: pnpm exec prettier --write apps/worker/src
      - run: |
          rm scripts/hsk06-normalize.py .github/workflows/hsk-06-normalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src scripts .github/workflows
          git commit -m 'fix(hsk-06): persist legacy evidence defaults'
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:hsk-06-protected-actions-evidence
