name: HSK-05 keyboard focus correction
on:
  push:
    branches: [hsk-05-webmcp]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hsk-05-webmcp }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hsk05_focus_fix.py
      - run: pnpm exec prettier --write apps/web/public/app.js
      - run: pnpm check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public/app.js
          git commit -m 'fix(hsk-05): preserve canvas keyboard focus'
          git push
