name: HSK-03 deterministic correction

on:
  push:
    branches:
      - hsk-03-worker-runtime

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hsk-03-worker-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - run: pnpm install --frozen-lockfile
      - name: Correct transformed internal URL
        run: |
          python -c "from pathlib import Path; p=Path('apps/worker/src/index.ts'); s=p.read_text(); lines=s.splitlines(); lines=[\"    const internalUrl = 'https:' + '//session.internal/' + encodeURIComponent(route.resource);\" if 'const internalUrl =' in line else line for line in lines]; p.write_text('\\n'.join(lines) + '\\n')"
      - run: pnpm exec prettier --write .
      - name: Commit deterministic corrections
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'fix(hsk-03): correct internal routing and apply pinned formatting'
          git push
