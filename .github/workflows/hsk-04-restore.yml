name: HSK-04 restore runtime constants
on:
  push:
    branches: [hsk-04-shared-canvas]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hsk-04-shared-canvas }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hsk04_restore_constants.py
      - run: pnpm exec prettier --write apps/worker/src/index.ts
      - run: pnpm check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/index.ts
          git commit -m 'fix(hsk-04): restore runtime constants'
          git push
