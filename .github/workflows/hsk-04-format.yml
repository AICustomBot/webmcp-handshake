name: HSK-04 pinned formatting
on:
  push:
    branches: [hsk-04-shared-canvas]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hsk-04-shared-canvas }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/public apps/worker/src docs/RUNTIME.md tests/runtime.test.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public apps/worker/src docs/RUNTIME.md tests/runtime.test.ts
          git diff --cached --quiet || (git commit -m 'style(hsk-04): apply pinned formatting' && git push)
