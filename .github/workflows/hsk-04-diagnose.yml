name: HSK-04 validation diagnostics
on:
  push:
    branches: [hsk-04-shared-canvas]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hsk-04-shared-canvas }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - name: Capture validation
        run: pnpm check > hsk-04-ci-diagnostic.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hsk-04-ci-diagnostic.txt
          git commit -m 'ci(hsk-04): record validation diagnostic'
          git push
