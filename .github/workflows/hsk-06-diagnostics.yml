name: HSK-06 pin test clock
on:
  push:
    branches: [hsk-06-protected-actions-evidence]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hsk-06-protected-actions-evidence
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hsk06-test-clock.py
      - run: pnpm exec prettier --write tests/evidence.test.ts
      - run: |
          rm scripts/hsk06-test-clock.py .github/workflows/hsk-06-diagnostics.yml docs/hsk-06-ci-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests scripts .github/workflows docs
          git commit -m 'test(hsk-06): evaluate denials before expiry'
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:hsk-06-protected-actions-evidence
