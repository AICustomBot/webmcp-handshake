name: HSK-06 post-migration diagnostics
on:
  push:
    branches: [hsk-06-protected-actions-evidence]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hsk-06-protected-actions-evidence
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check > docs/hsk-06-ci-diagnostics.txt 2>&1 || true
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/hsk-06-ci-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci(hsk-06): record post-migration failure'
            git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:hsk-06-protected-actions-evidence
          fi
