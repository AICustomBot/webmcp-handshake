name: HSK-06 proof correction
on:
  push:
    branches: [hsk-06-protected-actions-evidence]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hsk-06-protected-actions-evidence }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/worker/src/evidence.ts tests/evidence.test.ts
      - run: pnpm check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/evidence.ts tests/evidence.test.ts
          git diff --cached --quiet || (git commit -m 'style(hsk-06): format consumed-proof flow' && git push)
